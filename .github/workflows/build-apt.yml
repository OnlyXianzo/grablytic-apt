name: Build APT Repository

# Rebuilds the signed APT index from Grablytic release .debs and publishes
# to GitHub Pages. Suite: stable, components: main, arches: amd64/arm64.
# Secrets: APT_GPG_PRIVATE (base64 armored signing key, no passphrase).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Grablytic release tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'
  schedule:
    - cron: '0 7 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || 'v0.0.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

      - name: Download .debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo/pool
          gh release download "$TAG" --repo OnlyXianzo/Grablytic --pattern "*.deb" --dir repo/pool/ --clobber
          ls -la repo/pool/

      - name: Build Packages indexes
        run: |
          mkdir -p repo/dists/stable/main/binary-amd64 repo/dists/stable/main/binary-arm64
          dpkg-scanpackages --arch amd64 repo/pool/ > repo/dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 repo/pool/ > repo/dists/stable/main/binary-arm64/Packages
          gzip -kf repo/dists/stable/main/binary-amd64/Packages
          gzip -kf repo/dists/stable/main/binary-arm64/Packages

      - name: Import signing key and build signed Release
        env:
          APT_GPG_PRIVATE_B64: ${{ secrets.APT_GPG_PRIVATE }}
        run: |
          [ -n "$APT_GPG_PRIVATE_B64" ] || { echo "::error::APT_GPG_PRIVATE secret missing"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$APT_GPG_PRIVATE_B64" | base64 -d | gpg --batch --import
          cat > "$RUNNER_TEMP/apt-release.conf" <<'EOF'
          APT::FTPArchive::Release::Origin "Grablytic";
          APT::FTPArchive::Release::Label "Grablytic";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64 arm64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "Grablytic official APT repository";
          EOF
          apt-ftparchive -c "$RUNNER_TEMP/apt-release.conf" release repo/dists/stable > repo/dists/stable/Release
          gpg --batch --yes --clearsign -o repo/dists/stable/InRelease repo/dists/stable/Release
          cp grablytic.asc repo/grablytic.asc

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
